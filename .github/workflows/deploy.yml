name: Deploy to Hetzner VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # Build Frontend 1: SarindaWeb
    - name: Install & Build SarindaWeb Frontend
      run: |
        cd frontend-modern
        npm install
        npm run build

    # Build Frontend 2: Chamika Rice Mill WebApp
    - name: Install & Build Chamika Rice Mill WebApp
      run: |
        cd ChamikaRiceMill/webapp
        npm install
        npm run build

    # Deploy to Server via SSH
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.KEY }}
        script: |
          # Create directories if not exist
          mkdir -p /var/www/sarinda-pos
          mkdir -p /var/www/html
          mkdir -p /var/www/chamika-mill

          # Pull latest code
          cd /var/www/sarinda-pos
          git fetch origin main
          git reset --hard origin/main

          # 1. Install & Build SarindaWeb Frontend ON THE SERVER
          cd /var/www/sarinda-pos/frontend-modern
          npm install
          npm run build
          rm -rf /var/www/html/*
          cp -r dist/* /var/www/html/

          # 2. Install & Build Chamika Rice Mill WebApp ON THE SERVER
          cd /var/www/sarinda-pos/ChamikaRiceMill/webapp
          npm install
          npm run build
          rm -rf /var/www/chamika-mill/*
          cp -r dist/* /var/www/chamika-mill/

          # 3. Install & Restart Backend Dependencies
          cd /var/www/sarinda-pos/backend
          npm install
          pm2 restart sarinda-backend || pm2 start ../devops/ecosystem.config.js
